name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend selfcheck (plugin.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run selfcheck
        run: node desktop-plugins/channel-sessions/selfcheck.js

  backend:
    name: Backend tests (service.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install --quiet pytest hermes-agent
      - name: Run pytest
        run: |
          cd plugins/channel-sessions/dashboard
          python -m pytest tests/ -v
